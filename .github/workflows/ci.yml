name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Install, build, test on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run
        run: |
          npm ci
          npm run all
  run:
    name: Deploy ${{matrix.ext}} on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        ext:
          - .zip
          - .tar.gz
          - .tar.bz2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy ${{matrix.ext}}
        uses: ./
        with:
          archiveUrl: https://github.com/Alex079/setup-custom-tool/wiki/sample/content${{matrix.ext}}
          archiveGlob: '*'
